site_name: ArcLM
site_description: Data-first workflows for causal language models.
repo_url: https://github.com/ahmad-al-dibo/arclm
exclude_docs: |
  versions/**
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Introduction: introduction.md
  - Why ArcLM?: why-arclm.md
  - Project Vision: project-vision.md
  - Installation: installation.md
