[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm"
dynamic = ["version"]
description = "A compact PyTorch toolkit for native language-model training and Hugging Face SFT."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
authors = [
  { name = "Ahmad Al Dibo"}
]
keywords = [
  "arclm",
  "sft",
  "llm",
  "language-model",
  "causal-language-model",
  "transformer",
  "pytorch",
  "training",
  "fine-tuning",
  "instruction-tuning",
  "nlp",
  "huggingface"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.24,<3",
  "sentencepiece>=0.2,<0.3",
  "transformers>=4.51,<6",
  "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
]
cuda = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
]
cuda121 = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
]
dev = [
  "pytest>=8",
  "build>=1.2,<2",
  "twine>=5,<7",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9,<10",
  "ruff>=0.8,<1",
  "mypy>=1.10,<2",
  "pip-audit>=2.7,<3",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9,<10",
]
web = [
  "flask>=3,<4",
]
preprocess = [
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]
peft = [
  "peft>=0.11,<1",
]
hf = [
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
]
examples = [
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all-cpu = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all-cuda = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all-cuda121 = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/ahmad-al-dibo/arclm"
Documentation = "https://github.com/ahmad-al-dibo/arclm#readme"
Source = "https://github.com/ahmad-al-dibo/arclm"
Issues = "https://github.com/ahmad-al-dibo/arclm/issues"
Changelog = "https://github.com/ahmad-al-dibo/arclm/blob/main/CHANGELOG.md"

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
packages = ["arclm", "arclm.logics", "arclm.loaders", "arclm.models", "arclm.preprocess", "arclm.templates", "arclm.tokenizers", "arclm.training"]

[tool.setuptools.package-data]
arclm = ["templates/*.html"]

[tool.setuptools.dynamic]
version = { attr = "arclm._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "slow: tests that download/load external models or run heavier workflows",
  "hf: tests that require Hugging Face/Transformers integration",
  "transformers: tests that require Transformers integration",
  "cli: command-line interface tests",
  "docs: documentation and documented public import tests",
  "integration: cross-component integration tests",
  "benchmark: benchmark smoke tests",
  "security: security smoke tests",
]

[tool.ruff]
target-version = "py39"
line-length = 160
extend-exclude = [
  "README.md",
  "arclm",
  "arclm/api.py",
  "arclm/__init__.py",
  "arclm/_version.py",
  "arclm/checkpoints.py",
  "arclm/cli.py",
  "arclm/config.py",
  "arclm/utils.py",
  "docs",
  "docs/versions",
  "examples",
  "scripts",
  "site",
  "build",
  "dist",
  ".venv",
  ".test-venv",
  ".test-sdist-venv",
  "setup.py",
  "train.py",
  "usage.py",
  "tests/test_data_pipeline.py",
  "tests/test_gpt2_certification.py",
  "tests/test_instruction_sft.py",
  "tests/test_library_smoke.py",
  "tests/test_preprocess_pipeline.py",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["F822"]

[tool.ruff.format]
docstring-code-format = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
no_site_packages = true
disable_error_code = ["import-untyped"]
ignore_errors = true
exclude = "(docs|site|build|dist|examples)"
