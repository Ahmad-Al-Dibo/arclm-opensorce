[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm"
dynamic = ["version"]
description = "A compact PyTorch toolkit for native language-model training and Hugging Face SFT."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
authors = [
  { name = "Ahmad Al Dibo"}
]
keywords = [
  "arclm",
  "sft",
  "llm",
  "language-model",
  "causal-language-model",
  "transformer",
  "pytorch",
  "training",
  "fine-tuning",
  "instruction-tuning",
  "nlp",
  "huggingface"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.24,<3",
  "sentencepiece>=0.2,<0.3",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
]
cuda = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
]
cuda121 = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
]
dev = [
  "pytest>=8",
  "build>=1.2,<2",
  "twine>=5,<7",
]
web = [
  "flask>=3,<4",
]
preprocess = [
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]
peft = [
  "peft>=0.11,<1",
]
hf = [
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
]
examples = [
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all-cpu = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all-cuda = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all-cuda121 = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "flask>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/ahmad-al-dibo/arclm"
Documentation = "https://github.com/ahmad-al-dibo/arclm#readme"
Source = "https://github.com/ahmad-al-dibo/arclm"
Issues = "https://github.com/ahmad-al-dibo/arclm/issues"
Changelog = "https://github.com/ahmad-al-dibo/arclm/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["arclm", "arclm.logics", "arclm.loaders", "arclm.preprocess", "arclm.tokenizers", "arclm.training"]

[tool.setuptools.package-data]
arclm = ["templates/*.html"]

[tool.setuptools.dynamic]
version = { attr = "arclm._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
