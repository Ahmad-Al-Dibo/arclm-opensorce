<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcLM Web Inference</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    color-scheme: light;
    --bg: #f5f6f4;
    --panel: #ffffff;
    --text: #18212b;
    --muted: #637083;
    --line: #cfd6df;
    --accent: #1e6657;
    --accent-strong: #164d42;
    --warn: #8a4b11;
    --error: #a12828;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
}

main {
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 24px;
    display: grid;
    gap: 18px;
}

header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.status {
    min-height: 24px;
    color: var(--muted);
    font-size: 14px;
    text-align: right;
}

.grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 18px;
}

.panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
}

.panel-body {
    padding: 16px;
    display: grid;
    gap: 14px;
}

.field {
    display: grid;
    gap: 6px;
}

label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 11px;
    font: inherit;
    color: var(--text);
    background: #ffffff;
}

textarea {
    min-height: 220px;
    resize: vertical;
    line-height: 1.5;
}

.row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    min-height: 40px;
    border: 0;
    border-radius: 6px;
    padding: 9px 14px;
    font: inherit;
    font-weight: 700;
    color: #ffffff;
    background: var(--accent);
    cursor: pointer;
}

button.secondary {
    color: var(--text);
    background: #e7ece9;
}

button:disabled {
    cursor: wait;
    opacity: 0.65;
}

.check {
    display: flex;
    align-items: center;
    gap: 8px;
}

.check input {
    width: 18px;
    height: 18px;
}

.output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.view-toggle {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #ffffff;
}

.view-toggle button {
    min-height: 34px;
    padding: 6px 10px;
    border-radius: 0;
    color: var(--text);
    background: transparent;
}

.view-toggle button.active {
    color: #ffffff;
    background: var(--accent-strong);
}

#output,
#inspectOutput {
    min-height: 180px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    background: #ffffff;
}

#inspectOutput {
    min-height: 96px;
    white-space: pre-wrap;
    color: var(--muted);
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
}

.raw-output {
    white-space: pre-wrap;
    font-family: Consolas, "Courier New", monospace;
    line-height: 1.5;
}

.markdown-output {
    line-height: 1.6;
}

.markdown-output h1,
.markdown-output h2,
.markdown-output h3 {
    margin: 18px 0 8px;
    line-height: 1.25;
}

.markdown-output h1 {
    font-size: 26px;
}

.markdown-output h2 {
    font-size: 22px;
}

.markdown-output h3 {
    font-size: 18px;
}

.markdown-output p,
.markdown-output ul,
.markdown-output ol,
.markdown-output blockquote,
.markdown-output pre {
    margin: 0 0 12px;
}

.markdown-output ul,
.markdown-output ol {
    padding-left: 24px;
}

.markdown-output blockquote {
    padding-left: 12px;
    border-left: 3px solid #98a8a1;
    color: #435666;
}

.markdown-output code {
    padding: 2px 5px;
    border-radius: 4px;
    background: #eef1f4;
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.95em;
}

.markdown-output pre {
    overflow-x: auto;
    padding: 12px;
    border-radius: 6px;
    background: #18212b;
    color: #eef6fb;
}

.markdown-output pre code {
    padding: 0;
    background: transparent;
    color: inherit;
}

.error {
    color: var(--error);
}

.warn {
    color: var(--warn);
}

@media (max-width: 820px) {
    main {
        padding: 16px;
    }

    header,
    .grid {
        display: grid;
        grid-template-columns: 1fr;
    }

    .status {
        text-align: left;
    }
}
</style>
</head>

<body>
<main>
    <header>
        <h1>ArcLM Web Inference</h1>
        <div id="status" class="status">Ready</div>
    </header>

    <section class="grid">
        <div class="panel">
            <div class="panel-body">
                <div class="field">
                    <label for="modelSource">Model source</label>
                    <input id="modelSource" type="text" value="{{ default_model_source }}" spellcheck="false">
                </div>

                <div class="row">
                    <div class="field">
                        <label for="baseModel">Base model</label>
                        <input id="baseModel" type="text" spellcheck="false">
                    </div>
                    <div class="field">
                        <label for="tokenizerPath">Tokenizer path</label>
                        <input id="tokenizerPath" type="text" spellcheck="false">
                    </div>
                </div>

                <div class="actions">
                    <button id="inspectButton" class="secondary" type="button" onclick="inspectModel()">Inspect</button>
                    <button id="loadButton" class="secondary" type="button" onclick="loadModel()">Load</button>
                </div>

                <div class="field">
                    <label for="savePath">Save path</label>
                    <input id="savePath" type="text" value="{{ default_model_save_path }}" spellcheck="false">
                </div>

                <div class="row">
                    <div class="field">
                        <label for="saveMode">Save mode</label>
                        <select id="saveMode">
                            <option value="auto">Auto</option>
                            <option value="full_model">Full model</option>
                            <option value="merged_model">Merged LoRA</option>
                            <option value="adapter_only">Adapter only</option>
                            <option value="native_arclm">Native ArcLM</option>
                        </select>
                    </div>
                    <label class="check" for="overwriteSave">
                        <input id="overwriteSave" type="checkbox">
                        Overwrite
                    </label>
                </div>

                <div class="actions">
                    <button id="saveButton" class="secondary" type="button" onclick="saveModel()">Save local</button>
                </div>

                <div id="inspectOutput"></div>

                <div class="field">
                    <label for="prompt">Prompt</label>
                    <textarea id="prompt" spellcheck="true"></textarea>
                </div>

                <div class="actions">
                    <button id="submit" type="button" onclick="sendPrompt()">Generate</button>
                </div>
            </div>
        </div>

        <aside class="panel">
            <div class="panel-body">
                <div class="row">
                    <div class="field">
                        <label for="device">Device</label>
                        <select id="device">
                            <option value="">Auto</option>
                            <option value="cpu">CPU</option>
                            <option value="cuda">CUDA</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="dtype">Dtype</label>
                        <select id="dtype">
                            <option value="auto">Auto</option>
                            <option value="float32">float32</option>
                            <option value="float16">float16</option>
                            <option value="bfloat16">bfloat16</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="deviceMap">Device map</label>
                    <input id="deviceMap" type="text" placeholder="auto" spellcheck="false">
                </div>

                <div class="row">
                    <label class="check" for="load4bit">
                        <input id="load4bit" type="checkbox">
                        4-bit
                    </label>
                    <label class="check" for="load8bit">
                        <input id="load8bit" type="checkbox">
                        8-bit
                    </label>
                </div>

                <div class="field">
                    <label for="maxTokens">Max tokens</label>
                    <input id="maxTokens" type="number" min="1" max="4096" value="100">
                </div>

                <div class="row">
                    <div class="field">
                        <label for="temperature">Temperature</label>
                        <input id="temperature" type="number" min="0" max="2" step="0.05" value="0.8">
                    </div>
                    <div class="field">
                        <label for="topP">Top p</label>
                        <input id="topP" type="number" min="0.05" max="1" step="0.05" value="0.9">
                    </div>
                </div>

                <div class="field">
                    <label for="repetitionPenalty">Repetition penalty</label>
                    <input id="repetitionPenalty" type="number" min="1" max="3" step="0.05" value="1.1">
                </div>
            </div>
        </aside>
    </section>

    <section>
        <div class="output-header">
            <strong>Output</strong>
            <div class="view-toggle">
                <button id="previewButton" class="active" type="button" onclick="setOutputView('preview')">Preview</button>
                <button id="rawButton" type="button" onclick="setOutputView('raw')">Markdown</button>
            </div>
        </div>
        <div id="output" class="markdown-output"></div>
    </section>
</main>

<script>
let latestOutput = "";
let outputView = "preview";

document.addEventListener("DOMContentLoaded", refreshStatus);

function modelPayload() {
    const payload = {
        model_source: document.getElementById("modelSource").value.trim(),
        base_model: document.getElementById("baseModel").value.trim(),
        tokenizer_path: document.getElementById("tokenizerPath").value.trim(),
        device: document.getElementById("device").value,
        device_map: document.getElementById("deviceMap").value.trim(),
        dtype: document.getElementById("dtype").value,
        load_in_4bit: document.getElementById("load4bit").checked,
        load_in_8bit: document.getElementById("load8bit").checked,
        trust_remote_code: true
    };

    Object.keys(payload).forEach(function(key) {
        if (payload[key] === "") {
            delete payload[key];
        }
    });

    return payload;
}

function generationPayload() {
    return {
        prompt: document.getElementById("prompt").value,
        max_new_tokens: Number(document.getElementById("maxTokens").value || 100),
        temperature: Number(document.getElementById("temperature").value || 0.8),
        top_p: Number(document.getElementById("topP").value || 0.9),
        repetition_penalty: Number(document.getElementById("repetitionPenalty").value || 1.1)
    };
}

function savePayload() {
    return {
        save_path: document.getElementById("savePath").value.trim(),
        save_mode: document.getElementById("saveMode").value,
        save_layout: "model_id",
        overwrite: document.getElementById("overwriteSave").checked
    };
}

async function refreshStatus() {
    try {
        const response = await fetch("/health");
        const data = await response.json();
        const loaded = data.loaded ? "loaded" : "not loaded";
        setStatus(data.model_source + " - " + loaded);
    } catch (err) {
        setStatus("Server unavailable", true);
    }
}

async function inspectModel() {
    const button = document.getElementById("inspectButton");
    const output = document.getElementById("inspectOutput");

    try {
        button.disabled = true;
        output.textContent = "Inspecting...";
        const response = await fetch("/model/inspect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(modelPayload())
        });
        const data = await response.json();
        if (!data.success) {
            throw new Error(data.error || "Inspect failed");
        }
        output.textContent = data.report;
        output.className = data.source_info.warnings.length ? "warn" : "";
        setStatus(data.source_info.source_type);
    } catch (err) {
        output.textContent = err.message;
        output.className = "error";
        setStatus("Inspect failed", true);
    } finally {
        button.disabled = false;
    }
}

async function loadModel() {
    const button = document.getElementById("loadButton");
    try {
        button.disabled = true;
        setStatus("Loading...");
        const response = await fetch("/model/load", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign(modelPayload(), { reload: true })) // this return somthink like this: {"model_source": "path/to/model", "reload": true}
        });
        const data = await response.json();
        if (!data.success) {
            throw new Error(data.error || "Load failed");
        }
        setStatus(data.model_source + " - loaded");
        if (data.source_info) {
            document.getElementById("inspectOutput").textContent =
                data.source_info.source_type + " on " + data.device;
        }
    } catch (err) {
        setStatus("Load failed", true);
        document.getElementById("inspectOutput").textContent = err.message;
        document.getElementById("inspectOutput").className = "error";
    } finally {
        button.disabled = false;
    }
}

async function saveModel() {
    const button = document.getElementById("saveButton");
    const output = document.getElementById("inspectOutput");

    try {
        button.disabled = true;
        output.className = "";
        output.textContent = "Saving...";
        setStatus("Saving...");
        const response = await fetch("/model/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign(modelPayload(), savePayload()))
        });
        const data = await response.json();
        if (!data.success) {
            throw new Error(data.error || "Save failed");
        }
        if (data.saved_path) {
            document.getElementById("modelSource").value = data.saved_path;
        }
        output.textContent = "Saved to: " + (data.saved_path || data.save_path);
        setStatus("Saved local");
    } catch (err) {
        output.textContent = err.message;
        output.className = "error";
        setStatus("Save failed", true);
    } finally {
        button.disabled = false;
    }
}

async function sendPrompt() {
    const button = document.getElementById("submit");
    const prompt = document.getElementById("prompt").value;

    if (!prompt.trim()) {
        return;
    }

    try {
        button.disabled = true;
        setStatus("Generating...");
        latestOutput = "";
        renderOutput();

        const response = await fetch("/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign(modelPayload(), generationPayload()))
        });
        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Generate failed");
        }

        latestOutput = data.generated || data.result || "";
        renderOutput();
        setStatus(data.model_source + " - done");
    } catch (err) {
        latestOutput = "Error: " + err.message;
        renderOutput();
        setStatus("Generate failed", true);
    } finally {
        button.disabled = false;
    }
}

function setStatus(text, isError) {
    const status = document.getElementById("status");
    status.textContent = text;
    status.className = isError ? "status error" : "status";
}

function setOutputView(view) {
    outputView = view;
    document.getElementById("previewButton").classList.toggle("active", view === "preview");
    document.getElementById("rawButton").classList.toggle("active", view === "raw");
    renderOutput();
}

function renderOutput() {
    const output = document.getElementById("output");

    if (outputView === "raw") {
        output.className = "raw-output";
        output.innerText = latestOutput;
        return;
    }

    output.className = "markdown-output";
    output.innerHTML = renderMarkdown(latestOutput);
}

function renderMarkdown(markdown) {
    const blocks = [];
    const codeBlocks = [];

    const withoutCode = markdown.replace(/```([\s\S]*?)```/g, function(_, code) {
        const index = codeBlocks.push(code.replace(/^\w+\n/, "")) - 1;
        return "\n@@CODE_BLOCK_" + index + "@@\n";
    });

    const lines = withoutCode.split(/\r?\n/);
    let paragraph = [];
    let list = null;

    function flushParagraph() {
        if (paragraph.length === 0) {
            return;
        }
        blocks.push("<p>" + inlineMarkdown(paragraph.join(" ")) + "</p>");
        paragraph = [];
    }

    function flushList() {
        if (!list) {
            return;
        }
        blocks.push("<" + list.type + ">" + list.items.join("") + "</" + list.type + ">");
        list = null;
    }

    lines.forEach(function(line) {
        const trimmed = line.trim();

        if (!trimmed) {
            flushParagraph();
            flushList();
            return;
        }

        const codeMatch = trimmed.match(/^@@CODE_BLOCK_(\d+)@@$/);
        if (codeMatch) {
            flushParagraph();
            flushList();
            const code = escapeHtml(codeBlocks[Number(codeMatch[1])] || "");
            blocks.push("<pre><code>" + code + "</code></pre>");
            return;
        }

        const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
            flushParagraph();
            flushList();
            const level = heading[1].length;
            blocks.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
            return;
        }

        const quote = trimmed.match(/^>\s+(.+)$/);
        if (quote) {
            flushParagraph();
            flushList();
            blocks.push("<blockquote>" + inlineMarkdown(quote[1]) + "</blockquote>");
            return;
        }

        const unordered = trimmed.match(/^[-*]\s+(.+)$/);
        const ordered = trimmed.match(/^\d+\.\s+(.+)$/);
        if (unordered || ordered) {
            flushParagraph();
            const type = unordered ? "ul" : "ol";
            if (!list || list.type !== type) {
                flushList();
                list = { type: type, items: [] };
            }
            list.items.push("<li>" + inlineMarkdown((unordered || ordered)[1]) + "</li>");
            return;
        }

        paragraph.push(trimmed);
    });

    flushParagraph();
    flushList();

    return blocks.join("");
}

function inlineMarkdown(text) {
    return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
