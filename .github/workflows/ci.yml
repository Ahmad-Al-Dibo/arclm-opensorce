name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,hf,preprocess,web,peft,examples]" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Dependency check
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q arclm tests
      - name: Static checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy arclm
      - name: Non-slow tests
        run: python -m pytest -m "not slow"
      - name: CLI tests
        run: python -m pytest -m cli
      - name: Documentation tests
        run: python -m pytest -m docs
      - name: Benchmark smoke tests
        run: python -m pytest -m benchmark
      - name: Security smoke tests
        run: python -m pytest -m security
      - name: Docs build
        run: python -m mkdocs build --strict

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*

  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,hf]" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Audit dependencies
        run: python -m pip_audit --progress-spinner off

  hf-certification:
    name: Slow Hugging Face certification
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,hf,peft,examples]" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Run slow HF tests
        run: python -m pytest -m "slow and hf"
